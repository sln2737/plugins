<section id="sanjaya-pass-rate-card" aria-labelledby="sanjaya-pass-rate-title">
  <h2 id="sanjaya-pass-rate-title">Pass marks and pass rates</h2>
  <p>Marks out of 40: 0, 19, 20, 40</p>
  <label for="sanjaya-pass-cutoff">Minimum passing mark</label>
  <output id="sanjaya-pass-cutoff-value" for="sanjaya-pass-cutoff">20</output>
  <input id="sanjaya-pass-cutoff" type="range" min="18" max="22" step="1" value="20">

  <figure aria-label="Counts of passing and failing students out of four">
    <div class="count-row">
      <label for="sanjaya-passing-count">Pass</label>
      <meter id="sanjaya-passing-count" min="0" max="4" value="2" aria-valuetext="2 of 4 students"></meter>
      <span data-passing>2</span>
    </div>
    <div class="count-row">
      <label for="sanjaya-failing-count">Fail</label>
      <meter id="sanjaya-failing-count" min="0" max="4" value="2" aria-valuetext="2 of 4 students"></meter>
      <span data-failing>2</span>
    </div>
    <figcaption role="status">Pass rate <strong data-rate>50%</strong></figcaption>
  </figure>

  <form>
    <fieldset>
      <legend>When the minimum rises from 20 to 21, what happens to the pass rate?</legend>
      <label><input type="radio" name="prediction" value="fall" required> It falls.</label>
      <label><input type="radio" name="prediction" value="same"> It stays the same.</label>
      <label><input type="radio" name="prediction" value="rise"> It rises.</label>
    </fieldset>
    <button type="submit" class="btn btn-primary">Check answer</button>
    <details>
      <summary>Hint</summary>
      <p>Look at the score that exactly meets the original minimum.</p>
    </details>
    <p role="status" data-feedback></p>
  </form>
</section>

<style>
  #sanjaya-pass-rate-card { max-inline-size: 34rem; color: var(--foreground, CanvasText); }
  #sanjaya-pass-rate-card h2 { margin-block: 0 0.5rem; }
  #sanjaya-pass-rate-card input[type="range"] { display: block; inline-size: 100%; margin-block: 0.5rem; }
  #sanjaya-pass-rate-card figure { margin: 0.75rem 0 1rem; }
  #sanjaya-pass-rate-card .count-row { display: grid; grid-template-columns: 3rem 1fr 2ch; gap: 0.5rem; align-items: center; }
  #sanjaya-pass-rate-card meter { inline-size: 100%; }
  #sanjaya-pass-rate-card figcaption { margin-block-start: 0.5rem; }
  #sanjaya-pass-rate-card fieldset { border: 0; margin: 0 0 0.75rem; padding: 0; min-inline-size: 0; }
  #sanjaya-pass-rate-card legend { padding: 0; margin-block-end: 0.25rem; }
  #sanjaya-pass-rate-card fieldset label { display: block; margin-block: 0.35rem; }
  #sanjaya-pass-rate-card details { margin-block-start: 0.5rem; }
  #sanjaya-pass-rate-card [data-feedback]:empty { margin: 0; }
</style>

<script>
  (() => {
    const root = document.getElementById("sanjaya-pass-rate-card");
    if (!root) return;

    const marks = [0, 19, 20, 40];
    const slider = root.querySelector('input[type="range"]');
    const cutoffOutput = root.querySelector("output");
    const passingMeter = root.querySelector("#sanjaya-passing-count");
    const failingMeter = root.querySelector("#sanjaya-failing-count");
    const passingText = root.querySelector("[data-passing]");
    const failingText = root.querySelector("[data-failing]");
    const rateText = root.querySelector("[data-rate]");
    const form = root.querySelector("form");
    const feedback = root.querySelector("[data-feedback]");

    function countPassing(cutoff) {
      return marks.filter(mark => mark >= cutoff).length;
    }

    function passRate(cutoff) {
      return `${100 * countPassing(cutoff) / marks.length}%`;
    }

    function renderCounts() {
      const cutoff = Number(slider.value);
      const passing = countPassing(cutoff);
      const failing = marks.length - passing;
      cutoffOutput.value = String(cutoff);
      passingMeter.value = passing;
      passingMeter.setAttribute("aria-valuetext", `${passing} of ${marks.length} students`);
      failingMeter.value = failing;
      failingMeter.setAttribute("aria-valuetext", `${failing} of ${marks.length} students`);
      passingText.textContent = String(passing);
      failingText.textContent = String(failing);
      rateText.textContent = passRate(cutoff);
    }

    slider.addEventListener("input", renderCounts);
    form.addEventListener("change", () => { feedback.textContent = ""; });
    form.addEventListener("submit", event => {
      event.preventDefault();
      const answer = new FormData(form).get("prediction");
      if (answer === "fall") {
        feedback.textContent = `The pass rate falls from ${passRate(20)} to ${passRate(21)}. Reply in chat with the score that changed category.`;
      } else {
        feedback.textContent = "Compare the counts at 20 and 21, then try again.";
      }
    });
    renderCounts();
  })();
</script>
